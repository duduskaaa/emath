spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

security:
  password:
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 19456
      iterations: 2