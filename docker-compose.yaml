name: emath

services:
  identity-db:
    image: postgres:16
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  identity-service:
    build:
      context: ./identity-service/
    ports:
      - 8100:8080
    environment:
      DB_HOST: identity-db
    depends_on:
      - identity-db

volumes:
  identity-db-data: