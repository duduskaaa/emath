name: emath

services:
  identity-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  identity-service:
    build:
      context: ./identity-service/
    ports:
      - 8100:8080
    environment:
      DB_HOST: identity-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - identity-db

volumes:
  identity-db-data: